# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pixxeldevice"
BBFILE_PATTERN_meta-pixxeldevice = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pixxeldevice = "6"

LAYERDEPENDS_meta-pixxeldevice = "core"
LAYERSERIES_COMPAT_meta-pixxeldevice = "blacksail wrynose"
